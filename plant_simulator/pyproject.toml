[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-simulator"
version = "0.1.0"
description = "Synthetic manufacturing data generator — optional, not used against a real plant."
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[tool.setuptools]
packages = ["plant_simulator"]
